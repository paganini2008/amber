# FindingFixes: the note of a finding's optimized SQL (suggestedSqlNote). {0} = the rewrite's safety note.
rewrite.note.equivalent=等价改写。
rewrite.note.equivalentWithMetadata=按已知元数据等价。{0}
rewrite.note.edgeCases=边界情况下行为会改变：{0}

# LeftJoinRule (AMB-S002). {0} = the WHERE condition, {1} = the outer-joined table or alias.
rewrite.leftJoin.title=LEFT JOIN → JOIN
rewrite.leftJoin.explanation=当 {1} 没有匹配行时，LEFT JOIN 补出的行（其列均为 NULL）永远不满足 WHERE 条件 {0}，因此这些行会被过滤掉，这个连接实际上已经是内连接。写成 JOIN 能如实表达这一点。如果本意是外连接，请改为把条件移到 ON 子句中。
rewrite.leftJoin.safety=WHERE 条件会排除 NULL，因此对任何数据结果都相同。

# NotInRule (AMB-S004). {0} = correlation predicate, {1} = alias, {2} = outer column; see each key.
rewrite.notIn.title=NOT IN（子查询）→ NOT EXISTS
rewrite.notIn.explanation=只要子查询产生一个 NULL，带子查询的 NOT IN 就一行都不返回。把同一条件写成关联条件（{0}）的 NOT EXISTS 能表达本意：保留没有匹配的行。
rewrite.notIn.explanation.aliased=只要子查询产生一个 NULL，带子查询的 NOT IN 就一行都不返回。把同一条件写成关联条件（{0}）的 NOT EXISTS 能表达本意：保留没有匹配的行。子查询读取的是同一张表，因此给它加上别名 {1}，以便仍能引用外层的 {2}。
rewrite.notIn.safety.metadata=已知元数据中 {0} 和 {1} 都是 NOT NULL，因此 NOT IN 与 NOT EXISTS 返回相同的行。结构检查比较的是输出和血缘，而不是新增的关联过滤条件。
rewrite.notIn.safety.nulls=出现 NULL 时结果不同：如果子查询产生 NULL 的 {1}，{0} 一行都不返回，并且永远不会保留 {2} 为 NULL 的行；NOT EXISTS 会忽略该 NULL 并保留这些行。这通常正是预期的行为。
rewrite.notIn.safety.nulls.unknown=出现 NULL 时结果不同：如果子查询产生 NULL 的 {1}，{0} 一行都不返回，并且永远不会保留 {2} 为 NULL 的行；NOT EXISTS 会忽略该 NULL 并保留这些行。这通常正是预期的行为。它们是否可为空尚不清楚（添加元数据以证明两者都是 NOT NULL）。

# DateRangeRule (AMB-S008). {0} = column unless noted.
rewrite.dateRange.title=对过滤列使用函数 → 改为对该列的范围条件
rewrite.dateRange.explanation={0} 把 {1} 包在函数里，因此 {1} 上的索引无法使用。把同样的过滤写成对原始列的范围条件就可以使用索引。
rewrite.dateRange.between={0} 和 {1}
rewrite.dateRange.safety.sqlite=SQLite 以文本或数字存储日期：当 {0} 保存的是 ISO-8601 文本（'YYYY-MM-DD…'，常见格式）时范围条件等价，对数字值（儒略日 / Unix 时间）则不同。
rewrite.dateRange.safety.unknownType={0} 的类型未知（请添加元数据）：对 DATE / TIMESTAMP 列，范围条件等价；对其他类型则不等价。
rewrite.dateRange.safety.unknownType.time={0} 的类型未知（请添加元数据）：对 DATE / TIMESTAMP 列，当 {1} 不含时间部分时范围条件等价；对其他类型则不等价。
rewrite.dateRange.safety.zoned={0} 的类型是 {1}：带时区的值属于哪一天取决于所用的时区，因此范围条件可能多包含或漏掉午夜前后的值。
rewrite.dateRange.safety.timeEquals=当 {0} 不含时间部分时等价（日期参数通常如此）；如果它带有时间，{1} 不匹配任何行，而范围条件会匹配那一天的一部分。
rewrite.dateRange.safety.timeRange=当 {0} 不含时间部分时等价（日期参数通常如此）；如果它带有时间，边界那一天的行可能不同。
rewrite.dateRange.safety.wholeDay=已知元数据中 {0} 的类型是 {1}，且 {2} 是整天，因此范围条件选出的行完全相同。
rewrite.dateRange.safety.wholeDays=已知元数据中 {0} 的类型是 {1}，且 {2} 都是整天，因此范围条件选出的行完全相同。

# UnionAllRule (AMB-S009).
rewrite.unionAll.title=UNION → UNION ALL
rewrite.unionAll.explanation=UNION 会对整个结果排序或哈希以去除重复行。UNION ALL 省去这项工作，保留每一行。
rewrite.unionAll.safety.membership=该集合只用于判断成员关系（IN / EXISTS），重复行不会改变结果。
rewrite.unionAll.safety.edgeCases=仅当各分支不会返回相同的行且每个分支都不返回重复行，或者可以接受重复行时才适用：UNION ALL 会保留 UNION 去掉的重复行。
rewrite.unionAll.reason=第 {0} 列在分支 {2} 中为 {1}，在分支 {4} 中为 {3}
rewrite.unionAll.reasonSeparator=；
rewrite.unionAll.safety.disjoint=没有任何一行会同时来自两个分支（{0}），并且每个分支返回的行互不重复（使用了 DISTINCT、对所选列 GROUP BY，或按已知元数据选择了其表的键），因此 UNION 没有可去除的重复行。

# SelectStarRule (AMB-S010). {0} = table name in the origin keys; the origins joined by ", " in the note.
rewrite.selectStar.title=SELECT * → 显式列清单
rewrite.selectStar.explanation=在写入表或视图的语句中，只要源表增加、删除或调整列的顺序，SELECT * 就会悄悄改变写入的内容。显式列出各列可以固定结果的形状。
rewrite.selectStar.origin.metadata={0}（导入的元数据）
rewrite.selectStar.origin.script={0}（在脚本中创建）
rewrite.selectStar.safety=这些列是 {0} 的已知列，按表中的顺序排列，也就是 * 目前展开的结果。如果数据库中的表定义与此不同，请核对列清单。

# DistinctGroupByRule (AMB-S011).
rewrite.distinctGroupBy.title=去掉 DISTINCT（GROUP BY 已经返回互不重复的行）
rewrite.distinctGroupBy.explanation=每个 GROUP BY 表达式都在选择列表中，因此每一行都是不同的分组，DISTINCT 去不掉任何行，只会多一次排序或哈希。
rewrite.distinctGroupBy.safety=所有分组列都被选中，因此对任何数据各行都互不重复。由于关键字被去掉，结构检查会在“排序和行数限制”下列出 DISTINCT。

# SubqueryOrderByRule (AMB-S012). {0} = the ORDER BY clause.
rewrite.subqueryOrderBy.title=去掉子查询中的 ORDER BY
rewrite.subqueryOrderBy.explanation=对使用它们的查询来说，子查询、派生表或 CTE 的行没有顺序，而这条语句中也没有任何地方限制或编号这些行，因此 {0} 只是多了一次排序。如果最终顺序重要，请对最外层查询排序。
rewrite.subqueryOrderBy.safety=没有任何行数限制、ROWNUM、窗口函数或依赖顺序的聚合使用子查询的顺序，因此结果是同一组行。由于该子句被去掉，结构检查会在“排序和行数限制”下列出 ORDER BY。

# RepeatedSubqueryRule (AMB-D002). {0} = number of copies, {1} = CTE name.
rewrite.repeatedSubquery.title=重复的子查询 → CTE
rewrite.repeatedSubquery.explanation=同一个子查询在这条语句中写了 {0} 次。在 CTE {1} 中计算一次并按名称引用，可以避免各副本逐渐不一致，也让数据库只计算一次。
rewrite.repeatedSubquery.safety=该子查询只引用自己的表，也不使用任何在多次计算之间会变化的内容，因此每个副本都返回与 CTE 相同的行。如果子查询带有 DISTINCT 或 ORDER BY，结构检查会只计一次，而不是 {0} 次。

# CorrelatedSubqueryRule (AMB-P003). {0} = output column, {1} = aggregate expression; {0} = column list in safety.metadata.
rewrite.correlated.title=相关子查询 → LEFT JOIN 分组派生表
rewrite.correlated.explanation={0} 的子查询会对外层查询的每一行执行一次。连接一个一次性为所有键计算 {1} 的派生表，得到的值相同：每个键一个分组，每个外层行最多匹配一次，没有匹配时为 NULL。
rewrite.correlated.explanation.count={0} 的子查询会对外层查询的每一行执行一次。连接一个一次性为所有键计算 {1} 的派生表，得到的值相同：每个键一个分组，每个外层行最多匹配一次，没有匹配时为 NULL（COUNT 通过 COALESCE 得到 0）。
rewrite.correlated.safety.metadata=已知元数据中关联列在两侧的类型相同（{0}），因此按内层列分组时每个外层行最多匹配一次。结构检查会看到新的 GROUP BY 和数据源。
rewrite.correlated.safety.types=当每一对关联列的类型都相同时等价。如果类型不同（例如内层为 VARCHAR、外层为 NUMBER），像 '01' 和 '1' 这样的内层键会形成两个分组，并且都匹配同一个外层行，该行就会重复。请添加元数据以证明类型一致。
