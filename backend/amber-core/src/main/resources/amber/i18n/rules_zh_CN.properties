# Engine texts: the performance and maintenance hints AMB-P001 … AMB-P009 (dialect/findings/rules).
# Simplified Chinese. UTF-8. Keys and {n} placeholders must match the English file (checked by MessagesTest).

# Shared
rules.list.separator=，

# AMB-P001 possible missing index (IndexRules)
rules.P001.message={0} 在 {2}中被使用了 {1}（{3}），但在已知的表定义中，{4}{5} 没有以 {6} 开头的索引。
rules.P001.times.one={0} 次
rules.P001.times.other={0} 次
rules.P001.statements.one={0} 条语句
rules.P001.statements.other={0} 条语句
rules.P001.joins.one={0} 个连接条件
rules.P001.joins.other={0} 个连接条件
rules.P001.filters.one={0} 个过滤条件
rules.P001.filters.other={0} 个过滤条件
rules.P001.rows=（据元数据约 {0} 行）
rules.P001.suggestion=可以考虑以 {0} 开头的索引，例如 {1}。此提示基于脚本中的用法和表定义；添加之前请在数据库中核实真实数据量和已有索引。
rules.P001.note=基于脚本用法和表定义的提示：创建之前请核实数据量、已有索引和写入负载。

# AMB-P002 implicit conversion (ConversionRule)
rules.P002.message={0} 在 {2} 中是 {1} 类型，却与 {3} 比较：{4}
rules.P002.variable=变量 {0}（{1}）
rules.P002.kind.string=字符串
rules.P002.kind.nstring=Unicode 字符串
rules.P002.kind.number=数字
rules.P002.kind.date=日期
rules.P002.kind.other=其他
rules.P002.why.pgTextNumber=PostgreSQL 在文本和数字之间没有隐式转换，因此语句会以 "operator does not exist" 失败。
rules.P002.why.columnToNumber=数据库会在每一行上把该列转换为数字，因此无法使用该列上的索引，'007' 之类的值会匹配 7，而不是数字的值会使语句失败。
rules.P002.why.numericString=该字符串只会被转换为数字一次（仍可使用索引）；直接写数字，意图更清楚。
rules.P002.why.mysqlString=MySQL 会把字符串转换为数字，不是数字的字符串会变成 0，因此比较会悄无声息地匹配到错误的行。
rules.P002.why.notANumber=该字符串会被转换为数字，但它并不是数字，因此语句会在运行时失败。
rules.P002.why.oracleDate=Oracle 使用会话的 NLS_DATE_FORMAT 转换该字符串，因此结果（或 ORA-01861 错误）取决于客户端设置。
rules.P002.why.sqlserverDate=SQL Server 按会话的 DATEFORMAT / LANGUAGE 解读该字符串，因此同一个脚本在另一台服务器上可能与不同的日期比较（或失败）。
rules.P002.why.nonIsoDate=该字符串不是 ISO 日期，因此会按会话设置解读（或按文本比较），结果可能因服务器而异。
rules.P002.why.national=national（Unicode）值的类型优先级更高，因此每一行都会转换该列，该列上的索引查找可能变成扫描。
rules.P002.suggestion.string=与列类型一致的字符串比较，例如 {0} = '{1}'（或者转换值，而不要转换列）。
rules.P002.suggestion.number=数字不要加引号：{0} = {1}。
rules.P002.suggestion.date.oracle=使用日期字面量 DATE 'yyyy-mm-dd'，或带明确格式的 TO_DATE('…', 'format')。
rules.P002.suggestion.date.sqlserver=使用无歧义的 'yyyymmdd'（或 'yyyy-mm-ddThh:mi:ss'）形式，或使用带样式编号的 CONVERT。
rules.P002.suggestion.date=用 ISO 形式 'yyyy-mm-dd' 书写日期（或使用带类型的字面量 DATE 'yyyy-mm-dd'）。
rules.P002.suggestion.national=使用与列类型一致的值：去掉 N 前缀（或把变量声明为 VARCHAR），这样就不会转换列。
rules.P002.note.text=现在按文本比较：像 '0{0}' 这样存储的值不再匹配；请检查存储格式。
rules.P002.note.number=结果行相同：该字符串原本就会被转换为这个数字。
rules.P002.note.date=日期不再依赖会话设置。
rules.P002.note.ascii=该值只包含 ASCII 字符，因此普通字符串的比较结果相同。

# AMB-P003 correlated subquery in the select list (QueryShapeRules)
rules.P003.message=这个子查询引用了外层查询的 {0}，因此外层查询每返回一行它就执行一次（有些优化器会改写它，很多不会）。
rules.P003.suggestion=一次性为所有行计算：连接一个分组派生表（LEFT JOIN (SELECT key, agg(…) … GROUP BY key) d ON d.key = outer key），或使用 {0}。对于简单的聚合形式，Amber 提供经过校验的改写。
rules.P003.apply.oracle=LATERAL 连接 / OUTER APPLY（12c+）
rules.P003.apply.other=连接

# AMB-P004 statements that can be combined (ProceduralRules)
rules.P004.combine.message.where=这条 UPDATE 与第 {1} 行的 UPDATE 修改 {0} 中相同的行（WHERE 相同）；每条 UPDATE 都会重新查找、锁定并写入这些行。
rules.P004.combine.message.noWhere=这条 UPDATE 与第 {1} 行的 UPDATE 修改 {0} 中相同的行（同一张表，没有 WHERE）；每条 UPDATE 都会重新查找、锁定并写入这些行。
rules.P004.combine.suggestion=把它们合并为一条 UPDATE（第二条不会读取第一条设置的值，因此结果相同；请检查按语句计数的触发器）。
rules.P004.combine.suggestion.sql=把它们合并为一条 UPDATE（第二条不会读取第一条设置的值，因此结果相同；请检查按语句计数的触发器）：\n{0}
rules.P004.combine.note=替换两条 UPDATE。结果相同，因为第二条既不设置也不读取第一条设置的列；行级触发器只触发一次而不是两次。
rules.P004.upsert.message=这条 {0} 与第 {2} 行的 {1} 按相同的键写入 {3}：这是分两遍处理数据的 upsert。
rules.P004.upsert.suggestion=把它写成 {0}，只读取一次源数据。
rules.P004.upsert.how.mysql=INSERT … ON DUPLICATE KEY UPDATE（需要匹配列上的唯一键）
rules.P004.upsert.how.sqlite=INSERT … ON CONFLICT (…) DO UPDATE（需要匹配列上的唯一键）
rules.P004.upsert.how.postgresql=INSERT … ON CONFLICT (…) DO UPDATE（需要唯一键），或在 PostgreSQL 15+ 上使用 MERGE
rules.P004.upsert.how.merge=一条 MERGE 语句（WHEN MATCHED THEN UPDATE … WHEN NOT MATCHED THEN INSERT …）

# AMB-P005 cursor loop that can be one statement (ProceduralRules)
rules.P005.message.insert=这个循环对游标的每一行执行一次 INSERT，而且循环体只使用游标行；一条基于集合的语句只需一遍就能完成同样的工作。
rules.P005.message.update=这个循环对游标的每一行执行一次 UPDATE，而且循环体只使用游标行；一条基于集合的语句只需一遍就能完成同样的工作。
rules.P005.message.delete=这个循环对游标的每一行执行一次 DELETE，而且循环体只使用游标行；一条基于集合的语句只需一遍就能完成同样的工作。
rules.P005.message.merge=这个循环对游标的每一行执行一次 MERGE，而且循环体只使用游标行；一条基于集合的语句只需一遍就能完成同样的工作。
rules.P005.message.other=这个循环对游标的每一行执行一次 {0}，而且循环体只使用游标行；一条基于集合的语句只需一遍就能完成同样的工作。
rules.P005.suggestion=用一条基于集合的语句替换循环（UPDATE … FROM / MERGE、INSERT … SELECT、DELETE … WHERE EXISTS）。请先确认游标不会两次返回同一目标行（否则先聚合），并且不需要逐行的错误处理或提交。
rules.P005.suggestion.sql=用一条语句替换循环，例如：\n{0}\n请先确认游标不会两次返回同一目标行（否则先聚合），并且不需要逐行的错误处理或提交。
rules.P005.note=替换整个循环。只有当游标对每个目标行最多返回一次，并且循环中没有其他内容依赖逐行处理时才等价。

# AMB-P006 OR across indexed columns (IndexRules)
rules.P006.message=OR 组合了 {0} 中不同索引列上的条件（{1}）；单个索引无法同时满足它们，因此数据库可能扫描整张表。
rules.P006.suggestion=把查询拆成多个 UNION ALL 分支，每个带索引的条件一个（排除前面分支已有的行，例如 AND (a <> 1 OR a IS NULL)），或确认执行计划会合并这些索引（bitmap OR / index merge / OR-expansion）。
rules.P006.note=每个分支都可以使用自己的索引；CASE 条件让匹配多个条件的行只保留在第一个分支中。切换之前请比较执行计划。

# AMB-P007 calculation on a compared column (QueryShapeRules); .indexed = the column has a known index
rules.P007.nullFn.message=连接条件中的 {0}({1}, …) 使 {1} 上的索引无法使用。
rules.P007.nullFn.message.indexed=连接条件中的 {0}({1}, …) 使 {1} 上已有的索引无法使用。
rules.P007.nullFn.suggestion=直接比较原始列并显式处理 NULL，例如 ({0} = x OR ({0} IS NULL AND x = default))，或把该列设为 NOT NULL。
rules.P007.arithmetic.message=对 {0} 的算术运算（{1}）在比较之前会对每一行计算，因此无法使用 {0} 上的索引。
rules.P007.arithmetic.message.indexed=对 {0} 的算术运算（{1}）在比较之前会对每一行计算，因此无法使用 {0} 上已有的索引。
rules.P007.concat.message=对 {0} 的拼接（{1}）在比较之前会对每一行计算，因此无法使用 {0} 上的索引。
rules.P007.concat.message.indexed=对 {0} 的拼接（{1}）在比较之前会对每一行计算，因此无法使用 {0} 上已有的索引。
rules.P007.indexedNote=（{0} 有以 {1} 开头的索引。）
rules.P007.concat.suggestion=分别比较各部分（例如 a.x = 'A' AND a.y = 'B'），或为该表达式建立索引。
rules.P007.arithmetic.suggestion=把计算移到比较的另一侧，让列保持原样参与比较。
rules.P007.arithmetic.suggestion.example=把计算移到比较的另一侧，让列保持原样参与比较。例如：{0}。
rules.P007.note=对精确数值和日期，结果行相同；浮点列请检查舍入。

# AMB-P008 COUNT used to test existence (ProceduralRules)
rules.P008.message=COUNT 读取每一条匹配行，只是为了判断是否存在。
rules.P008.suggestion=使用 {0} (SELECT 1 FROM … WHERE …)，找到第一条匹配行就会停止。{1}
rules.P008.hint.oracle=在 PL/SQL 中：SELECT COUNT(*) INTO v FROM … WHERE … AND ROWNUM = 1，或 CASE WHEN EXISTS (…) THEN 1 ELSE 0 END FROM dual。
rules.P008.hint.sqlserver=在 T-SQL 中：IF EXISTS (SELECT 1 FROM … WHERE …)。
rules.P008.note=结果行相同：只有当计数大于零时 EXISTS 才为真。

# AMB-P009 DISTINCT hiding a duplicating join (QueryShapeRules); suggestion as in the UI
rules.P009.message=选择列表只包含 {0} 的列，并且包含它的唯一键，因此它的行本来就不重复；DISTINCT 只是在去除连接 {1} 产生的重复行。
rules.P009.suggestion=用 EXISTS (SELECT 1 FROM … WHERE …) 判断其他表，而不是连接它们，并去掉 DISTINCT：这样不会产生重复行，也不需要排序或哈希。
