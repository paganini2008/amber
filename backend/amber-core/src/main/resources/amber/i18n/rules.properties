rules.list.separator=,\ 

# AMB-P001 possible missing index (IndexRules)
rules.P001.message={0} is used {1} in {2} ({3}), but no index of {4}{5} starts with {6} in the known table definition.
rules.P001.times.one={0} time
rules.P001.times.other={0} times
rules.P001.statements.one={0} statement
rules.P001.statements.other={0} statements
rules.P001.joins.one={0} join condition
rules.P001.joins.other={0} join conditions
rules.P001.filters.one={0} filter
rules.P001.filters.other={0} filters
rules.P001.rows=\ (about {0} rows per the metadata)
rules.P001.suggestion=Consider an index led by {0}, e.g. {1}. This hint is based on the script's usage and the table definition; check real data volumes and existing indexes in the database before adding one.
rules.P001.note=A hint from the script's usage and the table definition: check data volumes, existing indexes and write load before creating it.

# AMB-P002 implicit conversion (ConversionRule)
rules.P002.message={0} is {1} in {2} but is compared with {3}: {4}
rules.P002.variable=the variable {0} ({1})
rules.P002.kind.string=string
rules.P002.kind.nstring=national string
rules.P002.kind.number=number
rules.P002.kind.date=date
rules.P002.kind.other=other
rules.P002.why.pgTextNumber=PostgreSQL has no implicit cast between text and numbers, so the statement fails with "operator does not exist".
rules.P002.why.columnToNumber=the database converts the column to a number on every row, so an index on it cannot be used, values such as '007' match 7, and a value that is not a number fails the statement.
rules.P002.why.numericString=the string is converted to a number once (an index can still be used); write the number itself so the intent is clear.
rules.P002.why.mysqlString=MySQL converts the string to a number and a string that is not a number becomes 0, so the comparison silently matches the wrong rows.
rules.P002.why.notANumber=the string is converted to a number and is not one, so the statement fails at run time.
rules.P002.why.oracleDate=Oracle converts the string with the session's NLS_DATE_FORMAT, so the result (or an ORA-01861 error) depends on client settings.
rules.P002.why.sqlserverDate=SQL Server reads this string according to the session's DATEFORMAT / LANGUAGE, so the same script can compare with a different date (or fail) on another server.
rules.P002.why.nonIsoDate=the string is not an ISO date, so it is read according to session settings (or compared as text), and the result may differ between servers.
rules.P002.why.national=the national (Unicode) value has the higher type precedence, so the column is converted on every row and an index seek on it may become a scan.
rules.P002.suggestion.string=Compare with a string of the column's type, e.g. {0} = '{1}' (or convert the value, never the column).
rules.P002.suggestion.number=Write the number without quotes: {0} = {1}.
rules.P002.suggestion.date.oracle=Use a date literal DATE 'yyyy-mm-dd' or TO_DATE('…', 'format') with an explicit format.
rules.P002.suggestion.date.sqlserver=Use the unambiguous 'yyyymmdd' (or 'yyyy-mm-ddThh:mi:ss') form, or CONVERT with a style number.
rules.P002.suggestion.date=Write the date in ISO form 'yyyy-mm-dd' (or use a typed literal DATE 'yyyy-mm-dd').
rules.P002.suggestion.national=Use a value of the column's type: drop the N prefix (or declare the variable as VARCHAR) so the column is not converted.
rules.P002.note.text=The comparison is now on text: a stored value such as '0{0}' no longer matches; check the stored format.
rules.P002.note.number=Same rows: the string was converted to this number anyway.
rules.P002.note.date=The date no longer depends on session settings.
rules.P002.note.ascii=The value only has ASCII characters, so the plain string compares the same.

# AMB-P003 correlated subquery in the select list (QueryShapeRules)
rules.P003.message=This subquery refers to {0} of the outer query, so it runs once for every row the outer query returns (some optimizers rewrite it, many do not).
rules.P003.suggestion=Compute it once for all rows: join a grouped derived table (LEFT JOIN (SELECT key, agg(…) … GROUP BY key) d ON d.key = outer key) or use {0}. Amber offers a verified rewrite for the simple aggregate form.
rules.P003.apply.oracle=a LATERAL join / OUTER APPLY (12c+)
rules.P003.apply.other=a join

# AMB-P004 statements that can be combined (ProceduralRules)
rules.P004.combine.message.where=This UPDATE changes the same rows of {0} as the UPDATE on line {1} (same WHERE); each UPDATE finds, locks and writes the rows again.
rules.P004.combine.message.noWhere=This UPDATE changes the same rows of {0} as the UPDATE on line {1} (same table, no WHERE); each UPDATE finds, locks and writes the rows again.
rules.P004.combine.suggestion=Combine them into one UPDATE (the second does not read what the first sets, so the result is the same; check triggers that count statements).
rules.P004.combine.suggestion.sql=Combine them into one UPDATE (the second does not read what the first sets, so the result is the same; check triggers that count statements):\n{0}
rules.P004.combine.note=Replaces both UPDATEs. Same result because the second one neither sets nor reads a column the first one sets; row triggers fire once instead of twice.
rules.P004.upsert.message=This {0} and the {1} on line {2} write {3} for the same keys: an upsert done in two passes over the data.
rules.P004.upsert.suggestion=Write it as {0}, which reads the source once.
rules.P004.upsert.how.mysql=INSERT … ON DUPLICATE KEY UPDATE (needs a unique key on the matching columns)
rules.P004.upsert.how.sqlite=INSERT … ON CONFLICT (…) DO UPDATE (needs a unique key on the matching columns)
rules.P004.upsert.how.postgresql=INSERT … ON CONFLICT (…) DO UPDATE (unique key needed), or MERGE on PostgreSQL 15+
rules.P004.upsert.how.merge=one MERGE statement (WHEN MATCHED THEN UPDATE … WHEN NOT MATCHED THEN INSERT …)

# AMB-P005 cursor loop that can be one statement (ProceduralRules)
rules.P005.message.insert=This loop runs one insert per row of its cursor, and the loop body uses nothing but the cursor row; one set-based statement does the same work in a single pass.
rules.P005.message.update=This loop runs one update per row of its cursor, and the loop body uses nothing but the cursor row; one set-based statement does the same work in a single pass.
rules.P005.message.delete=This loop runs one delete per row of its cursor, and the loop body uses nothing but the cursor row; one set-based statement does the same work in a single pass.
rules.P005.message.merge=This loop runs one merge per row of its cursor, and the loop body uses nothing but the cursor row; one set-based statement does the same work in a single pass.
rules.P005.message.other=This loop runs one {0} per row of its cursor, and the loop body uses nothing but the cursor row; one set-based statement does the same work in a single pass.
rules.P005.suggestion=Replace the loop with one set-based statement (UPDATE … FROM / MERGE, INSERT … SELECT, DELETE … WHERE EXISTS). Check first that the cursor cannot return the same target row twice (aggregate it then), and that no per-row error handling or commit is needed.
rules.P005.suggestion.sql=Replace the loop with one statement, for example:\n{0}\nCheck first that the cursor cannot return the same target row twice (aggregate it then), and that no per-row error handling or commit is needed.
rules.P005.note=Replaces the whole loop. Equivalent only if the cursor returns each target row at most once and nothing else in the loop depends on processing row by row.

# AMB-P006 OR across indexed columns (IndexRules)
rules.P006.message=OR combines conditions on different indexed columns of {0} ({1}); a single index cannot serve them, so the database may scan the whole table.
rules.P006.suggestion=Split the query into UNION ALL branches, one per indexed condition (exclude rows of the earlier branches, e.g. AND (a <> 1 OR a IS NULL)), or check that the plan combines the indexes (bitmap OR / index merge / OR-expansion).
rules.P006.note=Each branch can use its own index; the CASE conditions keep a row that matches several terms in the first branch only. Compare the plans before switching.

# AMB-P007 calculation on a compared column (QueryShapeRules); .indexed = the column has a known index
rules.P007.nullFn.message={0}({1}, …) in the join condition hides {1} from an index on it.
rules.P007.nullFn.message.indexed={0}({1}, …) in the join condition hides {1} from the index on it.
rules.P007.nullFn.suggestion=Compare the bare column and handle NULLs explicitly, e.g. ({0} = x OR ({0} IS NULL AND x = default)), or make the column NOT NULL.
rules.P007.arithmetic.message=Arithmetic on {0} ({1}) is computed for every row before the comparison, so an index on {0} cannot be used.
rules.P007.arithmetic.message.indexed=Arithmetic on {0} ({1}) is computed for every row before the comparison, so the index on {0} cannot be used.
rules.P007.concat.message=Concatenation on {0} ({1}) is computed for every row before the comparison, so an index on {0} cannot be used.
rules.P007.concat.message.indexed=Concatenation on {0} ({1}) is computed for every row before the comparison, so the index on {0} cannot be used.
rules.P007.indexedNote=\ ({0} has an index led by {1}.)
rules.P007.concat.suggestion=Compare the parts separately (e.g. a.x = 'A' AND a.y = 'B'), or index the expression.
rules.P007.arithmetic.suggestion=Move the calculation to the other side of the comparison so the bare column is compared.
rules.P007.arithmetic.suggestion.example=Move the calculation to the other side of the comparison so the bare column is compared. For example: {0}.
rules.P007.note=Same rows for exact numbers and dates; check rounding for floating-point columns.

# AMB-P008 COUNT used to test existence (ProceduralRules)
rules.P008.message=COUNT reads every matching row only to test whether there is one.
rules.P008.suggestion=Use {0} (SELECT 1 FROM … WHERE …), which stops at the first matching row.{1}
rules.P008.hint.oracle=\ In PL/SQL: SELECT COUNT(*) INTO v FROM … WHERE … AND ROWNUM = 1, or a CASE WHEN EXISTS (…) THEN 1 ELSE 0 END FROM dual.
rules.P008.hint.sqlserver=\ In T-SQL: IF EXISTS (SELECT 1 FROM … WHERE …).
rules.P008.note=Same rows: EXISTS is true exactly when the count is above zero.

# AMB-P009 DISTINCT hiding a duplicating join (QueryShapeRules); suggestion as in the UI
rules.P009.message=The select list only has columns of {0} and includes a unique key of it, so its rows are distinct already; DISTINCT only removes the duplicates created by joining {1}.
rules.P009.suggestion=Test the other tables with EXISTS (SELECT 1 FROM … WHERE …) instead of joining them, and drop DISTINCT: no duplicates are produced and no sort or hash is needed.
