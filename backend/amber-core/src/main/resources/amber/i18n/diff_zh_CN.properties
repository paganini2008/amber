# Engine texts: change impact (diff). Simplified Chinese. UTF-8.
# Keys and {n} placeholders must match the English file (checked by MessagesTest).

# Statement-level reasons (diff/ScriptDiff.java). {0} is a label such as "UPDATE orders".
diff.reason.statementRemoved={0} 已被删除
diff.reason.orderChanged={0} 现在在脚本中的另一个位置执行
diff.reason.unparsedChange=一条已修改的语句无法解析；其影响未知
diff.reason.whereLost={0} 失去了 WHERE 子句：现在会影响每一行
diff.reason.whereLostFiltered={0} 失去了 WHERE 子句（原先按 {1} 过滤）：现在会影响每一行
diff.reason.filterLost={0} 不再按 {1} 过滤
diff.reason.added=新增 {0}
diff.reason.dropAddedForeign=新增 {0}，该对象不是由脚本创建的
diff.reason.addedWithoutWhere=新增不带 WHERE 的 {0}
diff.reason.formatOnly={0} 条语句仅在空白、注释或关键字大小写上不同
diff.reason.modified={0} 条语句被修改，但 Amber 看不到结构上的影响

# Control flow (statements moved into / out of blocks). Paths keep the engine notation "KIND name (line n)".
diff.control.movedInto={0} 移入了 {1}
diff.control.movedOutOf={0} 移出了 {1}
diff.control.movedFrom={0} 从 {1} 移到了 {2}
diff.control.topLevel=顶层

# Notes about the comparison.
diff.note.fallback.old=旧版本有语法错误，已使用回退解析进行比较；其中 {0} 条语句只做了扫描，因此其影响是近似的。
diff.note.fallback.new=新版本有语法错误，已使用回退解析进行比较；其中 {0} 条语句只做了扫描，因此其影响是近似的。
diff.note.findingsError.old=无法计算旧版本的发现项：{0}
diff.note.findingsError.new=无法计算新版本的发现项：{0}

# Headline of the summary. {0} = number of changed statements, {1} = counts, {2} = risk, {3} = top reason.
diff.headline.none=没有变化
diff.headline.formatOnly=仅格式变化：{0} 条语句被重新格式化；风险：低
diff.headline.modified={0} 条已修改
diff.headline.added={0} 条新增
diff.headline.removed={0} 条已删除
diff.headline.moved={0} 条已移动
diff.headline.separator=，
diff.headline.changed={0} 条语句有变化（{1}）；风险：{2}
diff.headline.changedBecause={0} 条语句有变化（{1}）；风险：{2}。{3}
diff.risk.HIGH=高
diff.risk.MEDIUM=中
diff.risk.LOW=低

# Findings (diff/FindingComparer.java). {0} = severity (below), {1} = rule id, {2} = finding title.
diff.finding.new=新增发现项 {1}（{2}），严重程度：{0}
diff.severity.HIGH=高
diff.severity.MEDIUM=中
diff.severity.LOW=低
diff.severity.INFO=提示

# Column lineage (diff/LineageComparer.java). {0} = owner.column; sources are names.
diff.column.removed=不再写入 {0}
diff.column.derived={0} 的推导方式变了：{1} → {2}
diff.column.added=新写入 {0}
diff.column.addedFrom=新写入 {0}，来源为 {1}
diff.column.sourcesReplaced={0} 现在来自 {1}，而不是 {2}
diff.column.sourcesAdded={0} 现在还来自 {1}
diff.column.sourcesRemoved={0} 不再来自 {1}
diff.columns.added={0}：新写入的列：{1}
diff.columns.removed={0}：不再写入的列：{1}
# Rows filtered / joined / grouped. {0} = target, {1} = source column.
diff.rows.now.FILTER={0}：行现在按 {1} 过滤
diff.rows.now.JOIN={0}：行现在按 {1} 连接
diff.rows.now.GROUP={0}：行现在按 {1} 分组
diff.rows.noLonger.FILTER={0}：行不再按 {1} 过滤
diff.rows.noLonger.JOIN={0}：行不再按 {1} 连接
diff.rows.noLonger.GROUP={0}：行不再按 {1} 分组

# Objects (diff/ObjectComparer.java). {0} = object name; {1} = access (SQL verb, kept as is) where used.
diff.object.noLongerUsed=不再使用 {0}（{1}）
diff.object.newlyUsed=新使用了 {0}（{1}）
diff.object.noLongerWrites=脚本不再写入 {0}
diff.object.noLongerAccess=脚本不再对 {0} 执行 {1}
diff.object.role={0} 的角色变了：{1} → {2}
diff.object.kind={0} 的类型变了：{1} → {2}
diff.object.destructive=脚本现在对 {0} 执行 {1}，而该对象不是由脚本创建的
diff.object.newTarget=脚本现在写入 {0}（{1}）
diff.object.newSource=脚本现在读取 {0}
diff.access.added.READ=新读取了 {0}
diff.access.removed.READ=不再读取 {0}
diff.access.added.CREATE=新创建了 {0}
diff.access.removed.CREATE=不再创建 {0}
diff.access.added.DROP=新删除了 {0}
diff.access.removed.DROP=不再删除 {0}
diff.access.added.other=现在对 {0} 执行 {1}
diff.access.removed.other=不再对 {0} 执行 {1}
# One statement. {0} = statement label, {1} = object name, {2} = access (SQL verb).
diff.ref.now.READ={0} 现在读取 {1}
diff.ref.now.CREATE={0} 现在创建 {1}
diff.ref.now.DROP={0} 现在删除 {1}
diff.ref.now.EXECUTE={0} 现在执行 {1}
diff.ref.now.other={0} 现在对 {1} 执行 {2}
diff.ref.noLonger.READ={0} 不再读取 {1}
diff.ref.noLonger.CREATE={0} 不再创建 {1}
diff.ref.noLonger.DROP={0} 不再删除 {1}
diff.ref.noLonger.EXECUTE={0} 不再执行 {1}
diff.ref.noLonger.other={0} 不再对 {1} 执行 {2}
diff.ref.targetChanged={0} 的目标变了：{1} → {2}
diff.ref.sourcesChanged={0} 读取 {1}，而不是 {2}
diff.ref.none=（无）

# Query shape (diff/ShapeComparer.java). Block paths keep the engine notation (SELECT, CTE name, roles).
diff.shape.message={0}：{1}
diff.shape.blockRemoved={0} 已删除
diff.shape.blockRemovedOn={0}（基于 {1}）已删除
diff.shape.blockAdded={0} 已新增
diff.shape.blockAddedOn={0}（基于 {1}）已新增
diff.shape.cteRenamed=CTE {0} 重命名为 {1}
diff.shape.setOperator={0}：{1} 变成了 {2}
diff.shape.sourceAdded={0} 现在读取 {1}
diff.shape.sourceRemoved={0} 不再读取 {1}
diff.shape.joins={0}：连接数 {1} → {2}
diff.shape.clauseAdded={0}：新增 {1}
diff.shape.clauseRemoved={0}：删除了 {1}
diff.shape.outputsReordered={0}：输出列的顺序变了
diff.shape.outputsChanged={0}：输出列 {1}
diff.shape.aliasRenamed={0}：{1} 的别名已重命名 {2} → {3}
