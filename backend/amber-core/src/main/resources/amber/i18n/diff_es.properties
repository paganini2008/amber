# Engine texts: change impact (diff). Spanish. UTF-8.
# Keys and {n} placeholders must match the English file (checked by MessagesTest).

# Statement-level reasons (diff/ScriptDiff.java). {0} is a label such as "UPDATE orders".
diff.reason.statementRemoved=Se eliminó {0}
diff.reason.orderChanged={0} ahora se ejecuta en otro punto del script
diff.reason.unparsedChange=No se pudo analizar una sentencia modificada; su impacto es desconocido
diff.reason.whereLost={0} perdió su cláusula WHERE: ahora afecta a todas las filas
diff.reason.whereLostFiltered={0} perdió su cláusula WHERE (filtraba por {1}): ahora afecta a todas las filas
diff.reason.filterLost={0} ya no filtra por {1}
diff.reason.added=Nueva sentencia {0}
diff.reason.dropAddedForeign=Nueva sentencia {0}, sobre un objeto que el script no crea
diff.reason.addedWithoutWhere=Nueva sentencia {0} sin WHERE
diff.reason.formatOnly={0} sentencia(s) difieren solo en espacios, comentarios o mayúsculas de palabras clave
diff.reason.modified={0} sentencia(s) modificadas sin un impacto estructural que Amber pueda ver

# Control flow (statements moved into / out of blocks). Paths keep the engine notation "KIND name (line n)".
diff.control.movedInto={0} se movió dentro de {1}
diff.control.movedOutOf={0} se movió fuera de {1}
diff.control.movedFrom={0} se movió de {1} a {2}
diff.control.topLevel=nivel superior

# Notes about the comparison.
diff.note.fallback.old=La versión anterior tiene errores de sintaxis y se comparó con análisis de respaldo; {0} sentencia(s) solo se examinaron por encima, así que su impacto es aproximado.
diff.note.fallback.new=La versión nueva tiene errores de sintaxis y se comparó con análisis de respaldo; {0} sentencia(s) solo se examinaron por encima, así que su impacto es aproximado.
diff.note.findingsError.old=No se pudieron calcular los hallazgos de la versión anterior: {0}
diff.note.findingsError.new=No se pudieron calcular los hallazgos de la versión nueva: {0}

# Headline of the summary. {0} = number of changed statements, {1} = counts, {2} = risk, {3} = top reason.
diff.headline.none=Sin cambios
diff.headline.formatOnly=Solo formato: {0} sentencia(s) reformateadas; riesgo bajo
diff.headline.modified={0} modificadas
diff.headline.added={0} agregadas
diff.headline.removed={0} eliminadas
diff.headline.moved={0} movidas
diff.headline.separator=,\ 
diff.headline.changed={0} sentencia(s) cambiaron ({1}); riesgo {2}
diff.headline.changedBecause={0} sentencia(s) cambiaron ({1}); riesgo {2}: {3}
diff.risk.HIGH=alto
diff.risk.MEDIUM=medio
diff.risk.LOW=bajo

# Findings (diff/FindingComparer.java). {0} = severity (below), {1} = rule id, {2} = finding title.
diff.finding.new=Nuevo hallazgo {1} ({2}) de gravedad {0}
diff.severity.HIGH=alta
diff.severity.MEDIUM=media
diff.severity.LOW=baja
diff.severity.INFO=info

# Column lineage (diff/LineageComparer.java). {0} = owner.column; sources are names.
diff.column.removed={0} ya no se escribe
diff.column.derived={0} se deriva de otra forma: {1} → {2}
diff.column.added={0} se escribe por primera vez
diff.column.addedFrom={0} se escribe por primera vez a partir de {1}
diff.column.sourcesReplaced={0} ahora proviene de {1} en lugar de {2}
diff.column.sourcesAdded={0} ahora también proviene de {1}
diff.column.sourcesRemoved={0} ya no proviene de {1}
diff.columns.added={0}: columnas que se escriben por primera vez: {1}
diff.columns.removed={0}: columnas que ya no se escriben: {1}
# Rows filtered / joined / grouped. {0} = target, {1} = source column.
diff.rows.now.FILTER={0}: las filas ahora se filtran por {1}
diff.rows.now.JOIN={0}: las filas ahora se unen por {1}
diff.rows.now.GROUP={0}: las filas ahora se agrupan por {1}
diff.rows.noLonger.FILTER={0}: las filas ya no se filtran por {1}
diff.rows.noLonger.JOIN={0}: las filas ya no se unen por {1}
diff.rows.noLonger.GROUP={0}: las filas ya no se agrupan por {1}

# Objects (diff/ObjectComparer.java). {0} = object name; {1} = access (SQL verb, kept as is) where used.
diff.object.noLongerUsed={0} ya no se usa ({1})
diff.object.newlyUsed={0} se usa por primera vez ({1})
diff.object.noLongerWrites=El script ya no escribe en {0}
diff.object.noLongerAccess=El script ya no ejecuta {1} sobre {0}
diff.object.role={0} cambia de rol: {1} → {2}
diff.object.kind={0} cambia de tipo: {1} → {2}
diff.object.destructive=El script ahora ejecuta {1} sobre {0}, un objeto que no crea
diff.object.newTarget=El script ahora escribe en {0} ({1})
diff.object.newSource=El script ahora lee {0}
diff.access.added.READ={0} se lee por primera vez
diff.access.removed.READ={0} ya no se lee
diff.access.added.CREATE={0} se crea por primera vez
diff.access.removed.CREATE={0} ya no se crea
diff.access.added.DROP={0} se elimina por primera vez
diff.access.removed.DROP={0} ya no se elimina
diff.access.added.other=Ahora ejecuta {1} sobre {0}
diff.access.removed.other=Ya no ejecuta {1} sobre {0}
# One statement. {0} = statement label, {1} = object name, {2} = access (SQL verb).
diff.ref.now.READ={0} ahora lee {1}
diff.ref.now.CREATE={0} ahora crea {1}
diff.ref.now.DROP={0} ahora elimina {1}
diff.ref.now.EXECUTE={0} ahora ejecuta {1}
diff.ref.now.other={0} ahora ejecuta {2} sobre {1}
diff.ref.noLonger.READ={0} ya no lee {1}
diff.ref.noLonger.CREATE={0} ya no crea {1}
diff.ref.noLonger.DROP={0} ya no elimina {1}
diff.ref.noLonger.EXECUTE={0} ya no ejecuta {1}
diff.ref.noLonger.other={0} ya no ejecuta {2} sobre {1}
diff.ref.targetChanged=Cambió el destino de {0}: {1} → {2}
diff.ref.sourcesChanged={0} lee {1} en lugar de {2}
diff.ref.none=(ninguno)

# Query shape (diff/ShapeComparer.java). Block paths keep the engine notation (SELECT, CTE name, roles).
diff.shape.message={0}: {1}
diff.shape.blockRemoved={0} eliminado
diff.shape.blockRemovedOn={0} eliminado (sobre {1})
diff.shape.blockAdded={0} agregado
diff.shape.blockAddedOn={0} agregado (sobre {1})
diff.shape.cteRenamed=CTE {0} renombrada a {1}
diff.shape.setOperator={0}: {1} pasó a ser {2}
diff.shape.sourceAdded={0} ahora lee {1}
diff.shape.sourceRemoved={0} ya no lee {1}
diff.shape.joins={0}: uniones {1} → {2}
diff.shape.clauseAdded={0}: se agregó {1}
diff.shape.clauseRemoved={0}: se quitó {1}
diff.shape.outputsReordered={0}: se reordenaron las columnas de salida
diff.shape.outputsChanged={0}: columnas de salida {1}
diff.shape.aliasRenamed={0}: el alias de {1} se renombró {2} → {3}
