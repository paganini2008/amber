# Engine texts: change impact (diff). English (reference). UTF-8.
# Keys and {n} placeholders must match the English file (checked by MessagesTest).

# Statement-level reasons (diff/ScriptDiff.java). {0} is a label such as "UPDATE orders".
diff.reason.statementRemoved={0} was removed
diff.reason.orderChanged={0} now runs at another point of the script
diff.reason.unparsedChange=A changed statement could not be parsed; its impact is unknown
diff.reason.whereLost={0} lost its WHERE clause: it now affects every row
diff.reason.whereLostFiltered={0} lost its WHERE clause (filtered on {1}): it now affects every row
diff.reason.filterLost={0} no longer filters on {1}
diff.reason.added=New {0}
diff.reason.dropAddedForeign=New {0}, an object the script does not create
diff.reason.addedWithoutWhere=New {0} without WHERE
diff.reason.formatOnly={0} statement(s) differ only in whitespace, comments or keyword case
diff.reason.modified={0} statement(s) modified without a structural impact Amber can see

# Control flow (statements moved into / out of blocks). Paths keep the engine notation "KIND name (line n)".
diff.control.movedInto={0} moved into {1}
diff.control.movedOutOf={0} moved out of {1}
diff.control.movedFrom={0} moved from {1} to {2}
diff.control.topLevel=top level

# Notes about the comparison.
diff.note.fallback.old=The old version has syntax errors and was compared with fallback parsing; {0} statement(s) were only scanned, so their impact is approximate.
diff.note.fallback.new=The new version has syntax errors and was compared with fallback parsing; {0} statement(s) were only scanned, so their impact is approximate.
diff.note.findingsError.old=Findings of old version could not be computed: {0}
diff.note.findingsError.new=Findings of new version could not be computed: {0}

# Headline of the summary. {0} = number of changed statements, {1} = counts, {2} = risk, {3} = top reason.
diff.headline.none=No changes
diff.headline.formatOnly=Formatting only: {0} statement(s) reformatted; risk LOW
diff.headline.modified={0} modified
diff.headline.added={0} added
diff.headline.removed={0} removed
diff.headline.moved={0} moved
diff.headline.separator=,\ 
diff.headline.changed={0} statement(s) changed ({1}); risk {2}
diff.headline.changedBecause={0} statement(s) changed ({1}); risk {2}: {3}
diff.risk.HIGH=HIGH
diff.risk.MEDIUM=MEDIUM
diff.risk.LOW=LOW

# Findings (diff/FindingComparer.java). {0} = severity (below), {1} = rule id, {2} = finding title.
diff.finding.new=New {0} finding {1} ({2})
diff.severity.HIGH=HIGH
diff.severity.MEDIUM=MEDIUM
diff.severity.LOW=LOW
diff.severity.INFO=INFO

# Column lineage (diff/LineageComparer.java). {0} = owner.column; sources are names.
diff.column.removed={0} is no longer written
diff.column.derived={0} is derived differently: {1} → {2}
diff.column.added={0} is newly written
diff.column.addedFrom={0} is newly written from {1}
diff.column.sourcesReplaced={0} now comes from {1} instead of {2}
diff.column.sourcesAdded={0} now also comes from {1}
diff.column.sourcesRemoved={0} no longer comes from {1}
diff.columns.added={0}: columns newly written: {1}
diff.columns.removed={0}: columns no longer written: {1}
# Rows filtered / joined / grouped. {0} = target, {1} = source column.
diff.rows.now.FILTER={0}: rows now filtered by {1}
diff.rows.now.JOIN={0}: rows now joined on {1}
diff.rows.now.GROUP={0}: rows now grouped by {1}
diff.rows.noLonger.FILTER={0}: rows no longer filtered by {1}
diff.rows.noLonger.JOIN={0}: rows no longer joined on {1}
diff.rows.noLonger.GROUP={0}: rows no longer grouped by {1}

# Objects (diff/ObjectComparer.java). {0} = object name; {1} = access (SQL verb, kept as is) where used.
diff.object.noLongerUsed={0} is no longer used ({1})
diff.object.newlyUsed={0} is newly used ({1})
diff.object.noLongerWrites=The script no longer writes {0}
diff.object.noLongerAccess=The script no longer {1}s {0}
diff.object.role={0} changes role: {1} → {2}
diff.object.kind={0} changes kind: {1} → {2}
diff.object.destructive=The script now {1}s {0}, an object it does not create
diff.object.newTarget=The script now writes to {0} ({1})
diff.object.newSource=The script now reads {0}
diff.access.added.READ={0} is newly read
diff.access.removed.READ={0} is no longer read
diff.access.added.CREATE={0} is newly created
diff.access.removed.CREATE={0} is no longer created
diff.access.added.DROP={0} is newly dropped
diff.access.removed.DROP={0} is no longer dropped
diff.access.added.other=Now {1}s {0}
diff.access.removed.other=No longer {1}s {0}
# One statement. {0} = statement label, {1} = object name, {2} = access (SQL verb).
diff.ref.now.READ={0} now reads {1}
diff.ref.now.CREATE={0} now creates {1}
diff.ref.now.DROP={0} now drops {1}
diff.ref.now.EXECUTE={0} now executes {1}
diff.ref.now.other={0} now {2}s {1}
diff.ref.noLonger.READ={0} no longer reads {1}
diff.ref.noLonger.CREATE={0} no longer creates {1}
diff.ref.noLonger.DROP={0} no longer drops {1}
diff.ref.noLonger.EXECUTE={0} no longer executes {1}
diff.ref.noLonger.other={0} no longer {2}s {1}
diff.ref.targetChanged={0} target changed: {1} → {2}
diff.ref.sourcesChanged={0} reads {1} instead of {2}
diff.ref.none=(none)

# Query shape (diff/ShapeComparer.java). Block paths keep the engine notation (SELECT, CTE name, roles).
diff.shape.message={0}: {1}
diff.shape.blockRemoved={0} removed
diff.shape.blockRemovedOn={0} removed on {1}
diff.shape.blockAdded={0} added
diff.shape.blockAddedOn={0} added on {1}
diff.shape.cteRenamed=CTE {0} renamed to {1}
diff.shape.setOperator={0}: {1} became {2}
diff.shape.sourceAdded={0} now reads {1}
diff.shape.sourceRemoved={0} no longer reads {1}
diff.shape.joins={0}: joins {1} → {2}
diff.shape.clauseAdded={0}: {1} added
diff.shape.clauseRemoved={0}: {1} removed
diff.shape.outputsReordered={0}: output columns reordered
diff.shape.outputsChanged={0}: output columns {1}
diff.shape.aliasRenamed={0}: alias of {1} renamed {2} → {3}
