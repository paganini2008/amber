# Engine texts: rule-based rewrites (rewrite.suggest, rewrite.optimize, a finding's optimized SQL). Spanish. UTF-8.
# Keys and {n} placeholders must match the English file (checked by MessagesTest).
# FindingFixes: the note of a finding's optimized SQL (suggestedSqlNote). {0} = the rewrite's safety note.
rewrite.note.equivalent=Reescritura equivalente.
rewrite.note.equivalentWithMetadata=Equivalente según los metadatos conocidos. {0}
rewrite.note.edgeCases=Cambia el comportamiento en casos límite: {0}

# LeftJoinRule (AMB-S002). {0} = the WHERE condition, {1} = the outer-joined table or alias.
rewrite.leftJoin.title=LEFT JOIN → JOIN
rewrite.leftJoin.explanation=La condición WHERE {0} nunca es verdadera para las filas que el LEFT JOIN agrega cuando {1} no tiene coincidencia (sus columnas son NULL), así que esas filas se descartan y la unión ya actúa como una unión interna. Escribir JOIN lo deja claro. Si se pretendía la unión externa, mueva la condición a la cláusula ON.
rewrite.leftJoin.safety=La condición WHERE rechaza NULL, así que el resultado es el mismo con cualquier dato.

# NotInRule (AMB-S004). {0} = correlation predicate, {1} = alias, {2} = outer column; see each key.
rewrite.notIn.title=NOT IN (subconsulta) → NOT EXISTS
rewrite.notIn.explanation=NOT IN con una subconsulta no devuelve ninguna fila en cuanto la subconsulta produce un NULL. NOT EXISTS con la misma condición escrita como correlación ({0}) expresa la intención: conservar las filas que no tienen coincidencia.
rewrite.notIn.explanation.aliased=NOT IN con una subconsulta no devuelve ninguna fila en cuanto la subconsulta produce un NULL. NOT EXISTS con la misma condición escrita como correlación ({0}) expresa la intención: conservar las filas que no tienen coincidencia. La subconsulta lee la misma tabla, así que recibe el alias {1} para que {2} de la consulta externa siga visible.
rewrite.notIn.safety.metadata=Tanto {0} como {1} son NOT NULL en los metadatos conocidos, así que NOT IN y NOT EXISTS devuelven las mismas filas. La comprobación estructural compara las salidas y el linaje, no el filtro correlacionado adicional.
rewrite.notIn.safety.nulls=Difiere cuando aparecen NULL: {0} no devuelve filas si la subconsulta produce un {1} NULL, y nunca conserva una fila cuyo {2} sea NULL; NOT EXISTS ignora el NULL y conserva esas filas. Suele ser el comportamiento deseado.
rewrite.notIn.safety.nulls.unknown=Difiere cuando aparecen NULL: {0} no devuelve filas si la subconsulta produce un {1} NULL, y nunca conserva una fila cuyo {2} sea NULL; NOT EXISTS ignora el NULL y conserva esas filas. Suele ser el comportamiento deseado. No se sabe si admiten NULL (agregue metadatos para demostrar que ambas son NOT NULL).

# DateRangeRule (AMB-S008). {0} = column unless noted.
rewrite.dateRange.title=Función sobre una columna filtrada → rango sobre la columna
rewrite.dateRange.explanation={0} oculta {1} dentro de una función, así que no se puede usar un índice sobre {1}. El mismo filtro escrito como un rango sobre la columna sin transformar sí puede usarlo.
rewrite.dateRange.between={0} y {1}
rewrite.dateRange.safety.sqlite=SQLite guarda las fechas como texto o números: el rango es equivalente cuando {0} contiene texto ISO-8601 ('YYYY-MM-DD…'), el formato habitual, y difiere con valores numéricos (juliano / Unix).
rewrite.dateRange.safety.unknownType=El tipo de {0} es desconocido (agregue metadatos): el rango es equivalente para una columna DATE / TIMESTAMP, y no para otros tipos.
rewrite.dateRange.safety.unknownType.time=El tipo de {0} es desconocido (agregue metadatos): el rango es equivalente para una columna DATE / TIMESTAMP cuando {1} no tiene hora del día, y no para otros tipos.
rewrite.dateRange.safety.zoned={0} es {1}: el día de un valor con zona horaria depende de la zona usada, así que el rango puede incluir u omitir valores cercanos a la medianoche.
rewrite.dateRange.safety.timeEquals=Equivalente cuando {0} no tiene hora del día (lo habitual en un parámetro de fecha); si lleva una hora, {1} no coincide con nada mientras que el rango coincide con parte de ese día.
rewrite.dateRange.safety.timeRange=Equivalente cuando {0} no tiene hora del día (lo habitual en un parámetro de fecha); si lleva una hora, las filas del día límite pueden diferir.
rewrite.dateRange.safety.wholeDay={0} es {1} en los metadatos conocidos y {2} es un día completo, así que el rango selecciona exactamente las mismas filas.
rewrite.dateRange.safety.wholeDays={0} es {1} en los metadatos conocidos y {2} son días completos, así que el rango selecciona exactamente las mismas filas.

# UnionAllRule (AMB-S009).
rewrite.unionAll.title=UNION → UNION ALL
rewrite.unionAll.explanation=UNION ordena o aplica hash a todo el resultado para eliminar filas duplicadas. UNION ALL se ahorra ese trabajo y conserva todas las filas.
rewrite.unionAll.safety.membership=El conjunto solo se usa para comprobar pertenencia (IN / EXISTS), donde las filas duplicadas no cambian el resultado.
rewrite.unionAll.safety.edgeCases=Solo si las ramas no pueden devolver la misma fila y ninguna rama devuelve duplicados, o si las filas duplicadas son aceptables: UNION ALL conserva los duplicados que UNION eliminaba.
rewrite.unionAll.reason=la columna {0} es {1} en la rama {2} y {3} en la rama {4}
rewrite.unionAll.reasonSeparator=;\ 
rewrite.unionAll.safety.disjoint=Ninguna fila puede venir de dos ramas ({0}), y cada rama devuelve filas distintas (DISTINCT, GROUP BY sobre sus columnas seleccionadas, o se selecciona la clave de su tabla según los metadatos conocidos), así que UNION no tiene duplicados que eliminar.

# SelectStarRule (AMB-S010). {0} = table name in the origin keys; the origins joined by ", " in the note.
rewrite.selectStar.title=SELECT * → lista de columnas explícita
rewrite.selectStar.explanation=SELECT * en una sentencia que escribe una tabla o vista cambia en silencio lo que se escribe cada vez que una tabla de origen gana, pierde o reordena columnas. Enumerar las columnas fija la forma.
rewrite.selectStar.origin.metadata={0} (metadatos importados)
rewrite.selectStar.origin.script={0} (creada en el script)
rewrite.selectStar.safety=Las columnas son las conocidas para {0}, en el orden de la tabla, que es lo que * expande hoy. Si la definición de la tabla difiere en la base de datos, revise la lista.

# DistinctGroupByRule (AMB-S011).
rewrite.distinctGroupBy.title=Quitar DISTINCT (GROUP BY ya devuelve filas distintas)
rewrite.distinctGroupBy.explanation=Todas las expresiones de GROUP BY están en la lista de selección, así que cada fila es un grupo distinto y DISTINCT no puede eliminar nada; solo cuesta una ordenación o un hash adicional.
rewrite.distinctGroupBy.safety=Todas las columnas de agrupación están seleccionadas, así que las filas son distintas con cualquier dato. La comprobación estructural muestra DISTINCT en orden y límites de filas porque la palabra clave desaparece.

# SubqueryOrderByRule (AMB-S012). {0} = the ORDER BY clause.
rewrite.subqueryOrderBy.title=Quitar ORDER BY de la subconsulta
rewrite.subqueryOrderBy.explanation=Las filas de una subconsulta, tabla derivada o CTE no tienen orden para la consulta que las usa, y nada en esta sentencia limita ni numera esas filas, así que {0} solo agrega una ordenación. Ordene la consulta más externa si importa el orden final.
rewrite.subqueryOrderBy.safety=Ningún límite de filas, ROWNUM, función de ventana ni agregado sensible al orden usa el orden de la subconsulta, así que el resultado es el mismo conjunto de filas. La comprobación estructural muestra ORDER BY en orden y límites de filas porque la cláusula desaparece.

# RepeatedSubqueryRule (AMB-D002). {0} = number of copies, {1} = CTE name.
rewrite.repeatedSubquery.title=Subconsulta repetida → CTE
rewrite.repeatedSubquery.explanation=La misma subconsulta está escrita {0} veces en esta sentencia. Calcularla una vez en la CTE {1} y hacer referencia a ella por su nombre evita que las copias se distancien y permite que la base de datos la evalúe una sola vez.
rewrite.repeatedSubquery.safety=La subconsulta solo hace referencia a sus propias tablas y no usa nada que cambie entre evaluaciones, así que cada copia devuelve las mismas filas que la CTE. Si la subconsulta tiene DISTINCT u ORDER BY, la comprobación estructural la cuenta una vez en lugar de {0}.

# CorrelatedSubqueryRule (AMB-P003). {0} = output column, {1} = aggregate expression; {0} = column list in safety.metadata.
rewrite.correlated.title=Subconsulta correlacionada → LEFT JOIN de una tabla derivada agrupada
rewrite.correlated.explanation=La subconsulta de {0} se ejecuta una vez por cada fila de la consulta externa. Unir una tabla derivada que calcula {1} para todas las claves a la vez da el mismo valor: un grupo por clave, como máximo una coincidencia por fila externa, NULL cuando no hay ninguna.
rewrite.correlated.explanation.count=La subconsulta de {0} se ejecuta una vez por cada fila de la consulta externa. Unir una tabla derivada que calcula {1} para todas las claves a la vez da el mismo valor: un grupo por clave, como máximo una coincidencia por fila externa, NULL (0 mediante COALESCE para COUNT) cuando no hay ninguna.
rewrite.correlated.safety.metadata=Las columnas correlacionadas tienen el mismo tipo en ambos lados ({0}) en los metadatos conocidos, así que agrupar por la columna interna coincide como máximo una vez con cada fila externa. La comprobación estructural ve el nuevo GROUP BY y el nuevo origen.
rewrite.correlated.safety.types=Equivalente cuando cada par de columnas correlacionadas tiene el mismo tipo. Si los tipos difieren (p. ej., VARCHAR en la interna y NUMBER en la externa), claves internas como '01' y '1' forman dos grupos que coinciden con la misma fila externa, que entonces se repetiría. Agregue metadatos para demostrar los tipos.
