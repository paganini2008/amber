# LeftJoinRule (AMB-S002). {0} = the WHERE condition, {1} = the outer-joined table or alias.
rewrite.leftJoin.title=LEFT JOIN → JOIN
rewrite.leftJoin.explanation=The WHERE condition {0} is never true for the rows the LEFT JOIN adds when {1} has no match (their columns are NULL), so those rows are filtered out and the join already behaves as an inner join. Writing JOIN says so. If the outer join was intended, move the condition into the ON clause instead.
rewrite.leftJoin.safety=The WHERE condition rejects NULL, so the result is the same for any data.

# NotInRule (AMB-S004). {0} = correlation predicate, {1} = alias, {2} = outer column; see each key.
rewrite.notIn.title=NOT IN (subquery) → NOT EXISTS
rewrite.notIn.explanation=NOT IN with a subquery returns no rows at all as soon as the subquery yields one NULL. NOT EXISTS with the same condition written as a correlation ({0}) states the intent: keep the rows that have no match.
rewrite.notIn.explanation.aliased=NOT IN with a subquery returns no rows at all as soon as the subquery yields one NULL. NOT EXISTS with the same condition written as a correlation ({0}) states the intent: keep the rows that have no match. The subquery reads the same table, so it gets the alias {1} to keep the outer {2} visible.
rewrite.notIn.safety.metadata=Both {0} and {1} are NOT NULL in the known metadata, so NOT IN and NOT EXISTS return the same rows. The structural check compares outputs and lineage, not the extra correlated filter.
rewrite.notIn.safety.nulls=Differs when NULLs occur: {0} returns no rows if the subquery yields a NULL {1}, and never keeps a row whose {2} is NULL; NOT EXISTS ignores the NULL and keeps such rows. That is usually the intended behavior.
rewrite.notIn.safety.nulls.unknown=Differs when NULLs occur: {0} returns no rows if the subquery yields a NULL {1}, and never keeps a row whose {2} is NULL; NOT EXISTS ignores the NULL and keeps such rows. That is usually the intended behavior. Their nullability is not known (add metadata to prove both NOT NULL).

# DateRangeRule (AMB-S008). {0} = column unless noted.
rewrite.dateRange.title=Function on a filtered column → range on the column
rewrite.dateRange.explanation={0} hides {1} inside a function, so an index on {1} cannot be used. The same filter written as a range on the bare column can use it.
rewrite.dateRange.between={0} and {1}
rewrite.dateRange.safety.sqlite=SQLite stores dates as text or numbers: the range is equivalent when {0} holds ISO-8601 text ('YYYY-MM-DD…'), the usual format, and differs for numeric (Julian / Unix) values.
rewrite.dateRange.safety.unknownType=The type of {0} is unknown (add metadata): the range is equivalent for a DATE / TIMESTAMP column, and not for other types.
rewrite.dateRange.safety.unknownType.time=The type of {0} is unknown (add metadata): the range is equivalent for a DATE / TIMESTAMP column when {1} has no time of day, and not for other types.
rewrite.dateRange.safety.zoned={0} is {1}: the day of a value with a time zone depends on the zone used, so the range can include or miss values near midnight.
rewrite.dateRange.safety.timeEquals=Equivalent when {0} has no time of day (the usual case for a date parameter); if it carries a time, {1} matches nothing while the range matches part of that day.
rewrite.dateRange.safety.timeRange=Equivalent when {0} has no time of day (the usual case for a date parameter); if it carries a time, rows on the boundary day can differ.
rewrite.dateRange.safety.wholeDay={0} is {1} in the known metadata and {2} is a whole day, so the range selects exactly the same rows.
rewrite.dateRange.safety.wholeDays={0} is {1} in the known metadata and {2} are whole days, so the range selects exactly the same rows.

# UnionAllRule (AMB-S009).
rewrite.unionAll.title=UNION → UNION ALL
rewrite.unionAll.explanation=UNION sorts or hashes the whole result to remove duplicate rows. UNION ALL skips that work and keeps every row.
rewrite.unionAll.safety.membership=The set is only used to test membership (IN / EXISTS), where duplicate rows do not change the result.
rewrite.unionAll.safety.edgeCases=Only if the branches cannot return the same row and no branch returns duplicates, or if duplicate rows are acceptable: UNION ALL keeps the duplicates UNION removed.
rewrite.unionAll.reason=column {0} is {1} in branch {2} and {3} in branch {4}
rewrite.unionAll.reasonSeparator=;\ 
rewrite.unionAll.safety.disjoint=No row can come from two branches ({0}), and each branch returns distinct rows (DISTINCT, GROUP BY over its selected columns, or its table's key is selected per the known metadata), so UNION has no duplicates to remove.

# SelectStarRule (AMB-S010). {0} = table name in the origin keys; the origins joined by ", " in the note.
rewrite.selectStar.title=SELECT * → explicit column list
rewrite.selectStar.explanation=SELECT * in a statement that writes a table or view silently changes what is written whenever a source table gains, loses or reorders columns. Listing the columns fixes the shape.
rewrite.selectStar.origin.metadata={0} (imported metadata)
rewrite.selectStar.origin.script={0} (created in the script)
rewrite.selectStar.safety=The columns are those known for {0}, in table order, which is what * expands to today. If the table definition differs in the database, check the list.

# DistinctGroupByRule (AMB-S011).
rewrite.distinctGroupBy.title=Remove DISTINCT (GROUP BY already returns distinct rows)
rewrite.distinctGroupBy.explanation=Every GROUP BY expression is in the select list, so each row is a different group and DISTINCT cannot remove anything; it only costs an extra sort or hash.
rewrite.distinctGroupBy.safety=The grouping columns are all selected, so the rows are distinct for any data. The structural check lists DISTINCT under ordering and row limits because the keyword is gone.

# SubqueryOrderByRule (AMB-S012). {0} = the ORDER BY clause.
rewrite.subqueryOrderBy.title=Remove ORDER BY from the subquery
rewrite.subqueryOrderBy.explanation=The rows of a subquery, derived table or CTE have no order for the query that uses them, and nothing in this statement limits or numbers those rows, so {0} only adds a sort. Order the outermost query if the final order matters.
rewrite.subqueryOrderBy.safety=No row limit, ROWNUM, window function or order-sensitive aggregate uses the subquery's order, so the result is the same set of rows. The structural check lists ORDER BY under ordering and row limits because the clause is gone.

# RepeatedSubqueryRule (AMB-D002). {0} = number of copies, {1} = CTE name.
rewrite.repeatedSubquery.title=Repeated subquery → CTE
rewrite.repeatedSubquery.explanation=The same subquery is written {0} times in this statement. Computing it once in the CTE {1} and referring to it by name keeps the copies from drifting apart and lets the database evaluate it once.
rewrite.repeatedSubquery.safety=The subquery refers only to its own tables and uses nothing that changes between evaluations, so every copy returns the same rows as the CTE. If the subquery has DISTINCT or ORDER BY, the structural check counts it once instead of {0} times.

# CorrelatedSubqueryRule (AMB-P003). {0} = output column, {1} = aggregate expression; {0} = column list in safety.metadata.
rewrite.correlated.title=Correlated subquery → LEFT JOIN of a grouped derived table
rewrite.correlated.explanation=The subquery for {0} runs once per row of the outer query. Joining a derived table that computes {1} for every key at once gives the same value: one group per key, at most one match per outer row, NULL when there is none.
rewrite.correlated.explanation.count=The subquery for {0} runs once per row of the outer query. Joining a derived table that computes {1} for every key at once gives the same value: one group per key, at most one match per outer row, NULL (0 via COALESCE for COUNT) when there is none.
rewrite.correlated.safety.metadata=The correlated columns have the same type on both sides ({0}) in the known metadata, so grouping by the inner column matches each outer row at most once. The structural check sees the new GROUP BY and source.
rewrite.correlated.safety.types=Equivalent when each correlated pair of columns has the same type. If the types differ (e.g. VARCHAR inner, NUMBER outer), inner keys such as '01' and '1' form two groups that both match one outer row, which would then be repeated. Add metadata to prove the types.
