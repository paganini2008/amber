# Engine texts: findings and the rule catalogue. English (reference). UTF-8.
# Keys and {n} placeholders must match the English file (checked by MessagesTest).

# Rule catalogue (engine.rules) and the title of every finding; same wording as the UI (findings.ts).
rule.AMB-S001.title=Cartesian product
rule.AMB-S001.description=Several tables in FROM without any join or WHERE condition: every row is combined with every row.
rule.AMB-S001.suggestion=Add join conditions, or write CROSS JOIN if the product is intended.
rule.AMB-S002.title=LEFT JOIN behaves as INNER JOIN
rule.AMB-S002.description=A WHERE condition on the right table of a LEFT JOIN drops the rows the outer join kept.
rule.AMB-S002.suggestion=Move the condition into the ON clause, or use INNER JOIN if that is intended.
rule.AMB-S003.title=Leading wildcard
rule.AMB-S003.description=LIKE '%x' cannot use an index on the column.
rule.AMB-S003.suggestion=Anchor the pattern at the start, or use full-text search.
rule.AMB-S004.title=NOT IN with a subquery
rule.AMB-S004.description=One NULL from the subquery makes NOT IN match no rows (certain when metadata says the column is nullable).
rule.AMB-S004.suggestion=Use NOT EXISTS, or filter NULLs out of the subquery.
rule.AMB-S005.title=Table read several times
rule.AMB-S005.description=The same table is read several times in one statement.
rule.AMB-S005.suggestion=Read it once in a CTE (or with conditional aggregation) and reuse the result.
rule.AMB-S006.title=Row-by-row DML in a loop
rule.AMB-S006.description=An INSERT, UPDATE, DELETE or MERGE runs once per loop iteration.
rule.AMB-S006.suggestion=Replace the loop with one set-based statement (INSERT … SELECT, UPDATE … FROM, MERGE), or batch it (FORALL / bulk binds).
rule.AMB-S007.title=COMMIT inside a loop
rule.AMB-S007.description=Committing every iteration is slow and leaves partial results when the loop fails.
rule.AMB-S007.suggestion=Commit once after the loop, or in larger batches.
rule.AMB-S008.title=Function on a filtered column
rule.AMB-S008.description=A function or calculation on a column in WHERE prevents an index on it from being used (HIGH when metadata shows the index).
rule.AMB-S008.suggestion=Compare the bare column with a transformed value (e.g. a date range instead of TRUNC(col)).
rule.AMB-S009.title=UNION removes duplicates
rule.AMB-S009.description=UNION sorts or hashes the result; UNION ALL may be enough.
rule.AMB-S009.suggestion=Use UNION ALL when the branches cannot overlap or duplicates are fine.
rule.AMB-S010.title=SELECT * written into a table or view
rule.AMB-S010.description=The column list changes whenever the source table changes.
rule.AMB-S010.suggestion=List the columns explicitly.
rule.AMB-S011.title=DISTINCT with GROUP BY
rule.AMB-S011.description=GROUP BY already returns one row per group.
rule.AMB-S011.suggestion=Remove DISTINCT unless the select list adds columns outside the groups.
rule.AMB-S012.title=ORDER BY in a subquery
rule.AMB-S012.description=The order of a subquery or CTE without a row limit is not kept by the outer query.
rule.AMB-S012.suggestion=Remove ORDER BY, or move it to the outermost query.
rule.AMB-M001.title=Many-to-many join
rule.AMB-M001.description=The join columns are unique on neither side, so rows repeat on both sides.
rule.AMB-M001.suggestion=Join on a unique key, or aggregate one side to one row per join key first. Check whether totals are inflated.
rule.AMB-D001.title=Duplicate statement
rule.AMB-D001.description=The same statement appears again (literals ignored).
rule.AMB-D001.suggestion=Remove the repetition or factor it into a procedure.
rule.AMB-D002.title=Repeated subquery
rule.AMB-D002.description=The same subquery appears several times in the script.
rule.AMB-D002.suggestion=Compute it once in a CTE or temp table and reuse it.
rule.AMB-I001.title=Dynamic SQL
rule.AMB-I001.description=SQL built at run time is not analyzed.
rule.AMB-I001.suggestion=Where possible, use static SQL so the statement can be checked.
rule.AMB-I002.title=Columns without a table
rule.AMB-I002.description=Columns that could not be attributed to a table.
rule.AMB-I002.suggestion=Qualify the columns with a table alias, or add metadata (DDL import, metadata pack or online mode).
rule.AMB-I003.title=Checks stopped early
rule.AMB-I003.description=The checks ran out of their time budget (AMBER_FINDINGS_SECONDS, default 60); later statements were not checked.
rule.AMB-I003.suggestion=Split the script into smaller files, or raise AMBER_FINDINGS_SECONDS.
rule.AMB-P001.title=Possible missing index
rule.AMB-P001.description=A column used in joins or filters has no index that starts with it in the known table definition (raised to LOW when used in 3 or more statements). A hint only: check real data volumes and existing indexes.
rule.AMB-P002.title=Implicit conversion
rule.AMB-P002.description=A column of a known type is compared with a value of another type, so the database converts one side: the column (an index cannot be used) or the value (with session-dependent formats or run-time errors).
rule.AMB-P003.title=Correlated subquery in the select list
rule.AMB-P003.description=A scalar subquery that refers to the outer row runs once per row; a join to a grouped derived table runs once.
rule.AMB-P004.title=Statements that can be combined
rule.AMB-P004.description=Consecutive UPDATEs of the same rows, or an UPDATE plus INSERT … WHERE NOT EXISTS on the same table (an upsert), can be one statement.
rule.AMB-P005.title=Cursor loop that can be one statement
rule.AMB-P005.description=A cursor loop whose body is a single DML using only the cursor row can be written as one set-based statement.
rule.AMB-P006.title=OR across indexed columns
rule.AMB-P006.description=OR between conditions on different indexed columns of one table can keep any single index from being used.
rule.AMB-P007.title=Calculation on a compared column
rule.AMB-P007.description=Arithmetic or concatenation on a column in WHERE / ON, or NVL / COALESCE / ISNULL on a join column, keeps an index on it from being used.
rule.AMB-P008.title=COUNT used to test existence
rule.AMB-P008.description=COUNT(*) > 0 counts every matching row; EXISTS stops at the first one.
rule.AMB-P009.title=DISTINCT hiding a duplicating join
rule.AMB-P009.description=The selected columns already include a unique key of one table; DISTINCT only removes duplicates the joins produce.

