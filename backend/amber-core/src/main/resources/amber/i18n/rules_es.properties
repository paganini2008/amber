# Engine texts: the performance and maintenance hints AMB-P001 … AMB-P009 (dialect/findings/rules).
# Spanish. UTF-8. Keys and {n} placeholders must match the English file (checked by MessagesTest).

# Shared
rules.list.separator=,\ 

# AMB-P001 possible missing index (IndexRules)
rules.P001.message={0} se usa {1} en {2} ({3}), pero en la definición de tabla conocida ningún índice de {4}{5} empieza por {6}.
rules.P001.times.one={0} vez
rules.P001.times.other={0} veces
rules.P001.statements.one={0} sentencia
rules.P001.statements.other={0} sentencias
rules.P001.joins.one={0} condición de unión
rules.P001.joins.other={0} condiciones de unión
rules.P001.filters.one={0} filtro
rules.P001.filters.other={0} filtros
rules.P001.rows=\ (unas {0} filas según los metadatos)
rules.P001.suggestion=Considere un índice que empiece por {0}, p. ej., {1}. Esta pista se basa en el uso del script y la definición de la tabla; antes de agregarlo, revise en la base de datos los volúmenes reales y los índices existentes.
rules.P001.note=Una pista basada en el uso del script y la definición de la tabla: antes de crearlo, revise los volúmenes de datos, los índices existentes y la carga de escritura.

# AMB-P002 implicit conversion (ConversionRule)
rules.P002.message={0} es {1} en {2}, pero se compara con {3}: {4}
rules.P002.variable=la variable {0} ({1})
rules.P002.kind.string=cadena
rules.P002.kind.nstring=cadena nacional
rules.P002.kind.number=número
rules.P002.kind.date=fecha
rules.P002.kind.other=otro
rules.P002.why.pgTextNumber=PostgreSQL no tiene conversión implícita entre texto y números, así que la sentencia falla con "operator does not exist".
rules.P002.why.columnToNumber=la base de datos convierte la columna a número en cada fila, así que no se puede usar un índice sobre ella, valores como '007' coinciden con 7 y un valor que no es un número hace fallar la sentencia.
rules.P002.why.numericString=la cadena se convierte a número una sola vez (todavía se puede usar un índice); escriba el número directamente para que la intención quede clara.
rules.P002.why.mysqlString=MySQL convierte la cadena a número y una cadena que no es un número se convierte en 0, así que la comparación coincide sin aviso con filas equivocadas.
rules.P002.why.notANumber=la cadena se convierte a número y no lo es, así que la sentencia falla en tiempo de ejecución.
rules.P002.why.oracleDate=Oracle convierte la cadena con el NLS_DATE_FORMAT de la sesión, así que el resultado (o un error ORA-01861) depende de la configuración del cliente.
rules.P002.why.sqlserverDate=SQL Server interpreta esta cadena según DATEFORMAT / LANGUAGE de la sesión, así que el mismo script puede compararse con otra fecha (o fallar) en otro servidor.
rules.P002.why.nonIsoDate=la cadena no es una fecha ISO, así que se interpreta según la configuración de la sesión (o se compara como texto) y el resultado puede variar entre servidores.
rules.P002.why.national=el valor nacional (Unicode) tiene mayor precedencia de tipo, así que la columna se convierte en cada fila y una búsqueda por índice sobre ella puede convertirse en un recorrido completo.
rules.P002.suggestion.string=Compare con una cadena del tipo de la columna, p. ej., {0} = '{1}' (o convierta el valor, nunca la columna).
rules.P002.suggestion.number=Escriba el número sin comillas: {0} = {1}.
rules.P002.suggestion.date.oracle=Use un literal de fecha DATE 'yyyy-mm-dd' o TO_DATE('…', 'format') con un formato explícito.
rules.P002.suggestion.date.sqlserver=Use la forma inequívoca 'yyyymmdd' (o 'yyyy-mm-ddThh:mi:ss'), o CONVERT con un número de estilo.
rules.P002.suggestion.date=Escriba la fecha en formato ISO 'yyyy-mm-dd' (o use un literal con tipo DATE 'yyyy-mm-dd').
rules.P002.suggestion.national=Use un valor del tipo de la columna: quite el prefijo N (o declare la variable como VARCHAR) para que la columna no se convierta.
rules.P002.note.text=Ahora la comparación es de texto: un valor almacenado como '0{0}' ya no coincide; revise el formato almacenado.
rules.P002.note.number=Mismas filas: la cadena se convertía a este número de todos modos.
rules.P002.note.date=La fecha ya no depende de la configuración de la sesión.
rules.P002.note.ascii=El valor solo tiene caracteres ASCII, así que la cadena simple compara igual.

# AMB-P003 correlated subquery in the select list (QueryShapeRules)
rules.P003.message=Esta subconsulta hace referencia a {0} de la consulta externa, así que se ejecuta una vez por cada fila que devuelve la consulta externa (algunos optimizadores la reescriben, muchos no).
rules.P003.suggestion=Calcúlela una sola vez para todas las filas: una con una tabla derivada agrupada (LEFT JOIN (SELECT key, agg(…) … GROUP BY key) d ON d.key = outer key) o use {0}. Amber ofrece una reescritura verificada para la forma de agregado simple.
rules.P003.apply.oracle=una unión LATERAL / OUTER APPLY (12c+)
rules.P003.apply.other=una unión

# AMB-P004 statements that can be combined (ProceduralRules)
rules.P004.combine.message.where=Este UPDATE cambia las mismas filas de {0} que el UPDATE de la línea {1} (mismo WHERE); cada UPDATE vuelve a buscar, bloquear y escribir las filas.
rules.P004.combine.message.noWhere=Este UPDATE cambia las mismas filas de {0} que el UPDATE de la línea {1} (misma tabla, sin WHERE); cada UPDATE vuelve a buscar, bloquear y escribir las filas.
rules.P004.combine.suggestion=Combínelos en un solo UPDATE (el segundo no lee lo que establece el primero, así que el resultado es el mismo; revise los disparadores que cuentan sentencias).
rules.P004.combine.suggestion.sql=Combínelos en un solo UPDATE (el segundo no lee lo que establece el primero, así que el resultado es el mismo; revise los disparadores que cuentan sentencias):\n{0}
rules.P004.combine.note=Reemplaza ambos UPDATE. Mismo resultado porque el segundo ni establece ni lee una columna que establezca el primero; los disparadores de fila se ejecutan una vez en lugar de dos.
rules.P004.upsert.message=Este {0} y el {1} de la línea {2} escriben en {3} para las mismas claves: un upsert hecho en dos pasadas sobre los datos.
rules.P004.upsert.suggestion=Escríbalo como {0}, que lee el origen una sola vez.
rules.P004.upsert.how.mysql=INSERT … ON DUPLICATE KEY UPDATE (necesita una clave única en las columnas de coincidencia)
rules.P004.upsert.how.sqlite=INSERT … ON CONFLICT (…) DO UPDATE (necesita una clave única en las columnas de coincidencia)
rules.P004.upsert.how.postgresql=INSERT … ON CONFLICT (…) DO UPDATE (se necesita una clave única), o MERGE en PostgreSQL 15+
rules.P004.upsert.how.merge=una sola sentencia MERGE (WHEN MATCHED THEN UPDATE … WHEN NOT MATCHED THEN INSERT …)

# AMB-P005 cursor loop that can be one statement (ProceduralRules)
rules.P005.message.insert=Este bucle ejecuta un INSERT por cada fila de su cursor, y el cuerpo del bucle solo usa la fila del cursor; una sentencia basada en conjuntos hace el mismo trabajo en una sola pasada.
rules.P005.message.update=Este bucle ejecuta un UPDATE por cada fila de su cursor, y el cuerpo del bucle solo usa la fila del cursor; una sentencia basada en conjuntos hace el mismo trabajo en una sola pasada.
rules.P005.message.delete=Este bucle ejecuta un DELETE por cada fila de su cursor, y el cuerpo del bucle solo usa la fila del cursor; una sentencia basada en conjuntos hace el mismo trabajo en una sola pasada.
rules.P005.message.merge=Este bucle ejecuta un MERGE por cada fila de su cursor, y el cuerpo del bucle solo usa la fila del cursor; una sentencia basada en conjuntos hace el mismo trabajo en una sola pasada.
rules.P005.message.other=Este bucle ejecuta un {0} por cada fila de su cursor, y el cuerpo del bucle solo usa la fila del cursor; una sentencia basada en conjuntos hace el mismo trabajo en una sola pasada.
rules.P005.suggestion=Reemplace el bucle por una sentencia basada en conjuntos (UPDATE … FROM / MERGE, INSERT … SELECT, DELETE … WHERE EXISTS). Compruebe antes que el cursor no pueda devolver dos veces la misma fila de destino (si puede, agréguelo antes) y que no se necesite manejo de errores ni COMMIT por fila.
rules.P005.suggestion.sql=Reemplace el bucle por una sola sentencia, por ejemplo:\n{0}\nCompruebe antes que el cursor no pueda devolver dos veces la misma fila de destino (si puede, agréguelo antes) y que no se necesite manejo de errores ni COMMIT por fila.
rules.P005.note=Reemplaza todo el bucle. Equivale solo si el cursor devuelve cada fila de destino como máximo una vez y nada más en el bucle depende del procesamiento fila por fila.

# AMB-P006 OR across indexed columns (IndexRules)
rules.P006.message=OR combina condiciones sobre distintas columnas indexadas de {0} ({1}); un solo índice no puede atenderlas, así que la base de datos puede recorrer toda la tabla.
rules.P006.suggestion=Divida la consulta en ramas UNION ALL, una por condición indexada (excluya las filas de las ramas anteriores, p. ej., AND (a <> 1 OR a IS NULL)), o compruebe que el plan combina los índices (bitmap OR / index merge / OR-expansion).
rules.P006.note=Cada rama puede usar su propio índice; las condiciones CASE dejan una fila que cumple varios términos solo en la primera rama. Compare los planes antes de cambiar.

# AMB-P007 calculation on a compared column (QueryShapeRules); .indexed = the column has a known index
rules.P007.nullFn.message={0}({1}, …) en la condición de unión impide usar un índice sobre {1}.
rules.P007.nullFn.message.indexed={0}({1}, …) en la condición de unión impide usar el índice sobre {1}.
rules.P007.nullFn.suggestion=Compare la columna sin transformar y trate los NULL explícitamente, p. ej., ({0} = x OR ({0} IS NULL AND x = default)), o haga la columna NOT NULL.
rules.P007.arithmetic.message=La aritmética sobre {0} ({1}) se calcula en cada fila antes de la comparación, así que no se puede usar un índice sobre {0}.
rules.P007.arithmetic.message.indexed=La aritmética sobre {0} ({1}) se calcula en cada fila antes de la comparación, así que no se puede usar el índice sobre {0}.
rules.P007.concat.message=La concatenación sobre {0} ({1}) se calcula en cada fila antes de la comparación, así que no se puede usar un índice sobre {0}.
rules.P007.concat.message.indexed=La concatenación sobre {0} ({1}) se calcula en cada fila antes de la comparación, así que no se puede usar el índice sobre {0}.
rules.P007.indexedNote=\ ({0} tiene un índice que empieza por {1}.)
rules.P007.concat.suggestion=Compare las partes por separado (p. ej., a.x = 'A' AND a.y = 'B'), o indexe la expresión.
rules.P007.arithmetic.suggestion=Pase el cálculo al otro lado de la comparación para que se compare la columna sin transformar.
rules.P007.arithmetic.suggestion.example=Pase el cálculo al otro lado de la comparación para que se compare la columna sin transformar. Por ejemplo: {0}.
rules.P007.note=Mismas filas para números exactos y fechas; revise el redondeo en columnas de coma flotante.

# AMB-P008 COUNT used to test existence (ProceduralRules)
rules.P008.message=COUNT lee todas las filas coincidentes solo para comprobar si existe alguna.
rules.P008.suggestion=Use {0} (SELECT 1 FROM … WHERE …), que se detiene en la primera fila coincidente.{1}
rules.P008.hint.oracle=\ En PL/SQL: SELECT COUNT(*) INTO v FROM … WHERE … AND ROWNUM = 1, o un CASE WHEN EXISTS (…) THEN 1 ELSE 0 END FROM dual.
rules.P008.hint.sqlserver=\ En T-SQL: IF EXISTS (SELECT 1 FROM … WHERE …).
rules.P008.note=Mismas filas: EXISTS es verdadero exactamente cuando el recuento es mayor que cero.

# AMB-P009 DISTINCT hiding a duplicating join (QueryShapeRules); suggestion as in the UI
rules.P009.message=La lista de selección solo tiene columnas de {0} e incluye una clave única de esa tabla, así que sus filas ya son distintas; DISTINCT solo elimina los duplicados que produce la unión con {1}.
rules.P009.suggestion=Compruebe las otras tablas con EXISTS (SELECT 1 FROM … WHERE …) en lugar de unirlas, y quite DISTINCT: no se producen duplicados ni hace falta ordenar o aplicar hash.
