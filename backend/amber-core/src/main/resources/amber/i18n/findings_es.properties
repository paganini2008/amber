# Engine texts: findings and the rule catalogue. Spanish. UTF-8.
# Keys and {n} placeholders must match the English file (checked by MessagesTest).

# Rule catalogue (engine.rules) and the title of every finding; same wording as the UI (findings.ts).
rule.AMB-S001.title=Producto cartesiano
rule.AMB-S001.description=Varias tablas en FROM sin ninguna condición de unión ni WHERE: cada fila se combina con todas las demás.
rule.AMB-S001.suggestion=Agregue condiciones de unión, o escriba CROSS JOIN si el producto es intencional.
rule.AMB-S002.title=LEFT JOIN que actúa como INNER JOIN
rule.AMB-S002.description=Una condición WHERE sobre la tabla derecha de un LEFT JOIN descarta las filas que la unión externa conservaba.
rule.AMB-S002.suggestion=Mueva la condición a la cláusula ON, o use INNER JOIN si es lo que se pretende.
rule.AMB-S003.title=Comodín al inicio
rule.AMB-S003.description=LIKE '%x' no puede usar un índice sobre la columna.
rule.AMB-S003.suggestion=Fije el patrón al inicio, o use búsqueda de texto completo.
rule.AMB-S004.title=NOT IN con una subconsulta
rule.AMB-S004.description=Un solo NULL de la subconsulta hace que NOT IN no coincida con ninguna fila (seguro cuando los metadatos indican que la columna admite NULL).
rule.AMB-S004.suggestion=Use NOT EXISTS, o filtre los NULL en la subconsulta.
rule.AMB-S005.title=Tabla leída varias veces
rule.AMB-S005.description=La misma tabla se lee varias veces en una sentencia.
rule.AMB-S005.suggestion=Léala una sola vez en una CTE (o con agregación condicional) y reutilice el resultado.
rule.AMB-S006.title=DML fila por fila dentro de un bucle
rule.AMB-S006.description=Un INSERT, UPDATE, DELETE o MERGE se ejecuta una vez por cada iteración del bucle.
rule.AMB-S006.suggestion=Reemplace el bucle por una sola sentencia basada en conjuntos (INSERT … SELECT, UPDATE … FROM, MERGE), o procese por lotes (FORALL / enlaces masivos).
rule.AMB-S007.title=COMMIT dentro de un bucle
rule.AMB-S007.description=Confirmar en cada iteración es lento y deja resultados parciales si el bucle falla.
rule.AMB-S007.suggestion=Confirme una sola vez después del bucle, o en lotes más grandes.
rule.AMB-S008.title=Función sobre una columna filtrada
rule.AMB-S008.description=Una función o un cálculo sobre una columna en WHERE impide usar su índice (alta cuando los metadatos muestran el índice).
rule.AMB-S008.suggestion=Compare la columna sin transformar con un valor transformado (p. ej., un rango de fechas en lugar de TRUNC(col)).
rule.AMB-S009.title=UNION elimina duplicados
rule.AMB-S009.description=UNION ordena o aplica hash al resultado; puede bastar con UNION ALL.
rule.AMB-S009.suggestion=Use UNION ALL cuando las ramas no puedan solaparse o los duplicados no importen.
rule.AMB-S010.title=SELECT * escrito en una tabla o vista
rule.AMB-S010.description=La lista de columnas cambia cada vez que cambia la tabla de origen.
rule.AMB-S010.suggestion=Enumere las columnas explícitamente.
rule.AMB-S011.title=DISTINCT junto con GROUP BY
rule.AMB-S011.description=GROUP BY ya devuelve una fila por grupo.
rule.AMB-S011.suggestion=Quite DISTINCT, salvo que la lista de selección agregue columnas fuera de los grupos.
rule.AMB-S012.title=ORDER BY en una subconsulta
rule.AMB-S012.description=La consulta externa no conserva el orden de una subconsulta o CTE sin límite de filas.
rule.AMB-S012.suggestion=Quite ORDER BY, o muévalo a la consulta más externa.
rule.AMB-M001.title=Unión de muchos a muchos
rule.AMB-M001.description=Las columnas de unión no son únicas en ningún lado, así que las filas se repiten en ambos.
rule.AMB-M001.suggestion=Una por una clave única, o agregue primero un lado a una fila por clave de unión. Compruebe si los totales están inflados.
rule.AMB-D001.title=Sentencia duplicada
rule.AMB-D001.description=La misma sentencia aparece de nuevo (sin tener en cuenta los literales).
rule.AMB-D001.suggestion=Elimine la repetición o extráigala a un procedimiento.
rule.AMB-D002.title=Subconsulta repetida
rule.AMB-D002.description=La misma subconsulta aparece varias veces en el script.
rule.AMB-D002.suggestion=Calcúlela una vez en una CTE o tabla temporal y reutilícela.
rule.AMB-I001.title=SQL dinámico
rule.AMB-I001.description=El SQL construido en tiempo de ejecución no se analiza.
rule.AMB-I001.suggestion=Siempre que sea posible, use SQL estático para que la sentencia pueda revisarse.
rule.AMB-I002.title=Columnas sin tabla
rule.AMB-I002.description=Columnas que no se pudieron atribuir a una tabla.
rule.AMB-I002.suggestion=Califique las columnas con un alias de tabla, o agregue metadatos (importación de DDL, paquete de metadatos o modo en línea).
rule.AMB-I003.title=Comprobaciones detenidas antes de tiempo
rule.AMB-I003.description=Las comprobaciones agotaron su tiempo disponible (AMBER_FINDINGS_SECONDS, 60 de forma predeterminada); las sentencias posteriores no se comprobaron.
rule.AMB-I003.suggestion=Divida el script en archivos más pequeños, o aumente AMBER_FINDINGS_SECONDS.
rule.AMB-P001.title=Posible índice faltante
rule.AMB-P001.description=Una columna usada en uniones o filtros no tiene ningún índice que empiece por ella en la definición de tabla conocida (sube a baja cuando se usa en 3 o más sentencias). Es solo una pista: revise los volúmenes reales y los índices existentes.
rule.AMB-P002.title=Conversión implícita
rule.AMB-P002.description=Una columna de tipo conocido se compara con un valor de otro tipo, así que la base de datos convierte un lado: la columna (no se puede usar un índice) o el valor (con formatos que dependen de la sesión o errores en tiempo de ejecución).
rule.AMB-P003.title=Subconsulta correlacionada en la lista de selección
rule.AMB-P003.description=Una subconsulta escalar que hace referencia a la fila externa se ejecuta una vez por fila; una unión con una tabla derivada agrupada se ejecuta una sola vez.
rule.AMB-P004.title=Sentencias que se pueden combinar
rule.AMB-P004.description=Varios UPDATE consecutivos de las mismas filas, o un UPDATE más un INSERT … WHERE NOT EXISTS sobre la misma tabla (un upsert), pueden ser una sola sentencia.
rule.AMB-P005.title=Bucle de cursor que puede ser una sola sentencia
rule.AMB-P005.description=Un bucle de cursor cuyo cuerpo es una sola DML que solo usa la fila del cursor puede escribirse como una sentencia basada en conjuntos.
rule.AMB-P006.title=OR entre columnas indexadas
rule.AMB-P006.description=Un OR entre condiciones sobre distintas columnas indexadas de una tabla puede impedir que se use cualquier índice individual.
rule.AMB-P007.title=Cálculo sobre una columna comparada
rule.AMB-P007.description=La aritmética o la concatenación sobre una columna en WHERE / ON, o NVL / COALESCE / ISNULL sobre una columna de unión, impide usar su índice.
rule.AMB-P008.title=COUNT usado para comprobar existencia
rule.AMB-P008.description=COUNT(*) > 0 cuenta todas las filas coincidentes; EXISTS se detiene en la primera.
rule.AMB-P009.title=DISTINCT que oculta una unión con duplicados
rule.AMB-P009.description=Las columnas seleccionadas ya incluyen una clave única de una tabla; DISTINCT solo elimina los duplicados que producen las uniones.

