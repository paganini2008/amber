<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title | replace: "Amber — ", "" }} | Amber{% else %}Amber{% endif %}</title>
<meta name="description" content="{{ site.description }}">
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/png" href="{{ '/assets/favicon-64.png' | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
<script src="{{ '/assets/js/theme.js' | relative_url }}"></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="{{ '/' | relative_url }}"><img src="{{ '/assets/logo-256.png' | relative_url }}" alt="" width="30" height="30">Amber</a>
    <nav class="site-nav" aria-label="Main">
      <a href="{{ '/#download' | relative_url }}">Download</a>
      <a class="nav-optional" href="{{ '/design.html' | relative_url }}"{% if page.url == '/design.html' %} aria-current="page"{% endif %}>Design</a>
      <a class="nav-optional" href="{{ '/protocol.html' | relative_url }}"{% if page.url == '/protocol.html' %} aria-current="page"{% endif %}>Protocol</a>
      <a href="https://github.com/paganini2008/amber">GitHub</a>
      <button class="theme-toggle" type="button" aria-label="Switch theme">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </nav>
  </div>
</header>
<main id="main" class="doc">
{{ content }}
</main>
<footer class="site-footer">
  <div class="wrap">
    <span>Amber is open source under the Apache License 2.0.</span>
    <ul>
      <li><a href="https://github.com/paganini2008/amber/blob/main/LICENSE">License</a></li>
      <li><a href="https://github.com/paganini2008/amber/blob/main/THIRD-PARTY-NOTICES.md">Third-party notices</a></li>
      <li><a href="https://github.com/paganini2008/amber/issues">Report an issue</a></li>
    </ul>
  </div>
</footer>
</body>
</html>
