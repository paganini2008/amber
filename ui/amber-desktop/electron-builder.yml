appId: com.github.paganini2008.amber
productName: Amber
copyright: Copyright © Amber contributors. Licensed under the Apache License 2.0.
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
  - '!**/*.map'
extraResources:
  - from: resources/engine
    to: engine
  - from: resources/runtime
    to: runtime
  - from: ../../LICENSE
    to: LICENSE
  - from: ../../THIRD-PARTY-NOTICES.md
    to: THIRD-PARTY-NOTICES.md
asar: true
# Used only to write the update metadata (latest.yml, latest-linux.yml, app-update.yml) for
# electron-updater. Nothing is uploaded by electron-builder: the release workflow runs it with
# --publish never and uploads the installers and metadata itself.
publish:
  provider: github
  owner: paganini2008
  repo: amber
  releaseType: release
afterPack: scripts/after-pack.mjs
mac:
  category: public.app-category.developer-tools
  icon: build/icon.png
  # Ad-hoc signature (no certificate). Without any signature, Apple silicon reports the
  # downloaded app as "damaged". Hardened runtime is off because ad-hoc signing cannot
  # satisfy its library validation for Electron's pre-signed frameworks.
  identity: '-'
  hardenedRuntime: false
  target:
    - target: dmg
  artifactName: Amber-macos-${arch}.${ext}
dmg:
  artifactName: Amber-macos-${arch}.${ext}
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: Amber-windows-x64-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: Amber-windows-x64-setup.${ext}
linux:
  icon: build/icon.png
  category: Development
  maintainer: Amber contributors
  synopsis: Read and understand large SQL scripts
  target:
    - target: deb
      arch: [x64]
    - target: rpm
      arch: [x64]
deb:
  artifactName: Amber-linux-x64.${ext}
rpm:
  artifactName: Amber-linux-x64.${ext}
